name: meteo
prefect-version: 3.0.0

deployments:
  - name: meteo-every-10min
    entrypoint: src/meteo/flows/ingest.py:meteo_micro_batch_flow
    work_pool:
      name: default-agent-pool
    schedules:
      - cron: "*/10 * * * *"
        timezone: UTC

  # Approach 3 (model-centric) — run on model-pool, served by the containerized
  # worker (Dockerfile.model) that has GRIB tooling + LightGBM. GFS publishes
  # ~4-5h after each 00/06/12/18Z cycle, so fetch shortly after.
  # Code is baked into the model image at /app; override the default pull step
  # (which would point at the host deploy-time path) so the Linux worker cd's there.
  - name: gfs-fetch-6h
    entrypoint: src/meteo_model/flows.py:meteo_model_flow
    work_pool:
      name: model-pool
    pull:
      - prefect.deployments.steps.set_working_directory:
          directory: /app
    schedules:
      - cron: "30 5,11,17,23 * * *"
        timezone: UTC

  - name: aifs-fetch-6h
    entrypoint: src/meteo_model/flows.py:aifs_flow
    work_pool:
      name: model-pool
    pull:
      - prefect.deployments.steps.set_working_directory:
          directory: /app
    schedules:
      - cron: "35 5,11,17,23 * * *"
        timezone: UTC

  - name: model-train-daily
    entrypoint: src/meteo_model/flows.py:train_flow
    work_pool:
      name: model-pool
    pull:
      - prefect.deployments.steps.set_working_directory:
          directory: /app
    schedules:
      - cron: "0 6 * * *"
        timezone: UTC

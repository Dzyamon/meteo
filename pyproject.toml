[project]
name = "meteo"
version = "0.1.0"
description = "Micro-batch weather nowcasting pipeline (Approach 1 MVP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "prefect>=3.0",
    "httpx>=0.27",
    "polars>=1.0",
    "psycopg[binary,pool]>=3.2",
    "boto3>=1.35",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
meteo-ingest = "meteo.flows.ingest:run_once"
meteo-serve = "meteo.api.main:serve"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

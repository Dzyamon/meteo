[project]
name = "meteo"
version = "0.1.0"
description = "Weather nowcasting pipelines: micro-batch (Approach 1) and streaming (Approach 2)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "prefect>=3.0",
    "httpx>=0.27",
    "polars>=1.0",
    "psycopg[binary,pool]>=3.2",
    "boto3>=1.35",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "kafka-python>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]
# Approach 3 (model-centric): GFS GRIB ingestion + local bias correction.
# eccodes needs a native library; on Windows the ecmwflibs wheel bundles it.
# Recommended: run these steps in the Linux meteo-model container (docker-compose.model.yml).
model = [
    "xarray>=2024.6",
    "cfgrib>=0.9.12",
    "eccodes>=2.38",
    "ecmwflibs>=0.6; sys_platform == 'win32'",
    "herbie-data>=2024.8",
]

[project.scripts]
meteo-ingest = "meteo.flows.ingest:run_once"
meteo-serve = "meteo.api.main:serve"
meteo-stream-producer = "meteo_stream.producer:main"
meteo-stream-consumer = "meteo_stream.consumer:main"
meteo-stream-alerter = "meteo_stream.alerter:main"
meteo-model-fetch = "meteo_model.flows:run_once"
meteo-model-train = "meteo_model.correct.train:main"
meteo-model-predict = "meteo_model.correct.predict:main"
meteo-ai-fetch = "meteo_model.ai_pipeline:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

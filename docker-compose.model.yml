# Approach 3 overlay (model-centric) — use with:
#   docker compose -f docker-compose.yml -f docker-compose.model.yml up -d --build
#
# Runs a Prefect worker on the model-pool. It has GRIB tooling (eccodes/cfgrib)
# + LightGBM, so it executes the gfs-fetch / aifs-fetch / model-train deployments
# (see prefect.yaml). Bronze -> ./data, models -> ./models (bind-mounted).
# Register the schedules once from the host:  prefect deploy --all

services:
  meteo-model-worker:
    build:
      context: .
      dockerfile: Dockerfile.model
    container_name: meteo-model-worker
    restart: unless-stopped  # survive the Prefect server not being ready yet on first boot
    environment:
      DATABASE_URL: postgresql://meteo:meteo@timescaledb:5432/meteo
      PREFECT_API_URL: http://prefect-server:4200/api
      USE_LOCAL_BRONZE: "true"
      LOCAL_BRONZE_PATH: /app/data/bronze
      MODEL_DIR: /app/models
      NWP_FORECAST_HOURS: "48"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./config:/app/config:ro
    depends_on:
      timescaledb:
        condition: service_healthy
      prefect-server:
        condition: service_started
    # Poll the model-pool and run the scheduled model flows. --type process
    # creates the pool on first start if it doesn't exist.
    command: ["prefect", "worker", "start", "--pool", "model-pool", "--type", "process"]
